<svg width="240" height="160" viewBox="0 0 240 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="160" fill="#F7F3EE"/>
  
  <!-- Coffee beans pattern -->
  <g fill="#8B7355" opacity="0.3">
    <!-- Large center bean -->
    <ellipse cx="120" cy="80" rx="18" ry="12" transform="rotate(-15 120 80)"/>
    <path d="M102 77c0-2 8-4 18-4s18 2 18 4c0 2-8 4-18 4s-18-2-18-4z" fill="#F7F3EE"/>
    
    <!-- Smaller surrounding beans -->
    <ellipse cx="80" cy="60" rx="12" ry="8" transform="rotate(25 80 60)"/>
    <path d="M70 59c0-1 4-2 10-2s10 1 10 2c0 1-4 2-10 2s-10-1-10-2z" fill="#F7F3EE"/>
    
    <ellipse cx="160" cy="100" rx="14" ry="9" transform="rotate(-45 160 100)"/>
    <path d="M148 98c0-1 5-2 12-2s12 1 12 2c0 1-5 2-12 2s-12-1-12-2z" fill="#F7F3EE"/>
    
    <ellipse cx="90" cy="120" rx="10" ry="7" transform="rotate(60 90 120)"/>
    <path d="M82 119c0-1 3-1 8-1s8 0 8 1c0 1-3 1-8 1s-8 0-8-1z" fill="#F7F3EE"/>
    
    <ellipse cx="170" cy="50" rx="11" ry="8" transform="rotate(-30 170 50)"/>
    <path d="M161 49c0-1 4-1 9-1s9 0 9 1c0 1-4 1-9 1s-9 0-9-1z" fill="#F7F3EE"/>
  </g>
  
  <!-- Text -->
  <text x="120" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" text-anchor="middle" fill="#6F665E">
    Coffee Beans
  </text>
</svg>