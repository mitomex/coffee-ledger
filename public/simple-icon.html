<!DOCTYPE html>
<html>
<head>
    <title>Icon Generator</title>
</head>
<body>
    <h1>Coffee Ledger Icons</h1>
    <p>右クリックして画像を保存してください</p>
    
    <!-- 192x192 Icon -->
    <canvas id="icon192" width="192" height="192"></canvas>
    <br>
    
    <!-- 512x512 Icon -->
    <canvas id="icon512" width="512" height="512"></canvas>
    <br>
    
    <!-- 180x180 Apple Touch Icon -->
    <canvas id="apple180" width="180" height="180"></canvas>
    
    <script>
        function drawIcon(canvasId, size) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            
            // Background
            ctx.fillStyle = '#1F1A16';
            ctx.fillRect(0, 0, size, size);
            
            // Coffee bean shape
            ctx.save();
            ctx.translate(size/2, size/2);
            
            // Bean body
            ctx.fillStyle = '#8B4513';
            ctx.beginPath();
            ctx.ellipse(0, 0, size*0.27, size*0.35, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Center line
            ctx.strokeStyle = '#5D2F0B';
            ctx.lineWidth = size * 0.015;
            ctx.beginPath();
            ctx.moveTo(0, -size*0.33);
            ctx.quadraticCurveTo(-size*0.06, 0, 0, size*0.33);
            ctx.moveTo(0, -size*0.33);
            ctx.quadraticCurveTo(size*0.06, 0, 0, size*0.33);
            ctx.stroke();
            
            // Highlight
            ctx.fillStyle = 'rgba(160, 82, 45, 0.5)';
            ctx.beginPath();
            ctx.ellipse(-size*0.08, -size*0.12, size*0.06, size*0.1, 0, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore();
            
            // Text
            ctx.fillStyle = '#F7F3EE';
            ctx.font = `${size*0.08}px serif`;
            ctx.textAlign = 'center';
            ctx.fillText('Coffee', size/2, size*0.88);
        }
        
        drawIcon('icon192', 192);
        drawIcon('icon512', 512);
        drawIcon('apple180', 180);
    </script>
</body>
</html>
